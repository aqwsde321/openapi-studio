name: Publish

# Push a version tag (npm version patch && git push --follow-tags) to publish that version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); no npm token is stored in the repository

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $version"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Publish the verified bundle without running prepublishOnly a second time.
      # Local npm publish still runs the build and unit tests through prepublishOnly.
      - run: npm publish --ignore-scripts
