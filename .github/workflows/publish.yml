name: Publish

# Push a version tag (npm version patch && git push --follow-tags) to publish that version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read
  id-token: write # npm trusted publishing (OIDC); no npm token is stored in the repository

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        id: release
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $version"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for matching main CI
        id: verified
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const { waitForVerifiedPackage } = require('./.github/scripts/verified-package.cjs');
            const verified = await waitForVerifiedPackage({
              github, ...context.repo, sha: process.env.RELEASE_SHA, log: core.info,
            });
            core.setOutput('run-id', verified.runId);
            core.setOutput('artifact-id', verified.artifactId);
      - name: Download verified release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run-id }}
          artifact-ids: ${{ steps.verified.outputs.artifact-id }}
          merge-multiple: true
          path: release-package
      - name: Check packed release
        id: package
        run: node .github/scripts/verified-package.cjs release-package >> "$GITHUB_OUTPUT"
      - name: Publish verified release
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$PACKAGE_TARBALL" --ignore-scripts
